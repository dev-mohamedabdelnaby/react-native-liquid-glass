buildscript {
  // The Compose compiler plugin must match the Kotlin version used by the app.
  def kotlinVersion = rootProject.ext.has("kotlinVersion")
    ? rootProject.ext.get("kotlinVersion")
    : (rootProject.findProperty("android.kotlinVersion") ?: "2.2.0")

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

ext.ReactNativeLiquidGlass = [
  minSdkVersion: 26,
  compileSdkVersion: 37,
  // The Android catalog app's versions (its gradle/libs.versions.toml).
  composeBomVersion: "2026.09.00",
  materialIconsExtendedVersion: "1.7.8",
  activityComposeVersion: "1.13.0",
  // What activity-compose 1.13.0 brings; the host routes the back key with it.
  navigationEventVersion: "1.0.0",
  lifecycleVersion: "2.11.0"
]

ext.getExtOrDefault = { prop ->
  if (rootProject.ext.has(prop)) {
    return rootProject.ext.get(prop)
  }

  return ReactNativeLiquidGlass[prop]
}


apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "org.jetbrains.kotlin.plugin.compose"

apply plugin: "com.facebook.react"

android {
  namespace "com.mohamedabdelnaby.liquidglass"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  buildFeatures {
    compose true
  }

  // The glass engine's backdrop code uses context parameters.
  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.freeCompilerArgs.add("-Xcontext-parameters")
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  implementation platform("androidx.compose:compose-bom:${getExtOrDefault("composeBomVersion")}")
  implementation "androidx.compose.ui:ui"
  implementation "androidx.compose.ui:ui-graphics"
  implementation "androidx.compose.ui:ui-tooling-preview"
  implementation "androidx.compose.foundation:foundation"
  implementation "androidx.compose.material3:material3"
  implementation "androidx.compose.material:material-icons-extended:${getExtOrDefault("materialIconsExtendedVersion")}"
  implementation "androidx.activity:activity-compose:${getExtOrDefault("activityComposeVersion")}"
  implementation "androidx.navigationevent:navigationevent-compose:${getExtOrDefault("navigationEventVersion")}"
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:${getExtOrDefault("lifecycleVersion")}"

  testImplementation "junit:junit:4.13.2"
}
